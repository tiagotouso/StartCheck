<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Deck Executivo — StartCheck Docs</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/data.js"></script>
  <style>
    .deck-container {
      max-width: 900px;
      margin: 2rem auto;
      min-height: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 3rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }
    .slide-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .slide-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
      margin-top: 2rem;
    }
    .btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: var(--accent-cyan);
      color: #000;
      border-color: var(--accent-cyan);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">🚀 StartCheck Docs</div>
    <nav class="nav">
      <a href="index.html">Início</a>
      <a href="arquitetura.html">Arquitetura</a>
      <a href="modulos.html">Módulos</a>
      <a href="metricas.html">Métricas</a>
      <a href="glossario.html">Glossário</a>
      <a href="deck.html" class="active">Deck</a>
    </nav>
  </header>

  <main class="container">
    <div class="deck-container">
      <div id="slide-wrapper" class="slide-content">
        <!-- Renderizado dinamicamente -->
      </div>

      <div class="slide-controls">
        <button id="btn-prev" class="btn" onclick="prevSlide()">← Anterior</button>
        <span id="slide-counter" style="color: var(--text-muted); font-size: 0.9rem;">Slide 1 de 7</span>
        <button id="btn-next" class="btn" onclick="nextSlide()">Próximo →</button>
      </div>
    </div>
  </main>

  <script>
    const slides = [
      {
        tag: "VISÃO GERAL",
        title: "StartCheck",
        subtitle: "Sistema Inteligente de Modelagem de Startups",
        body: "Orquestração de agentes cognitivos, skills analíticas e harness com validação contínua por semáforo e exportação multiformato em DOCX e XLSX."
      },
      {
        tag: "O PROBLEMA",
        title: "Modelagem Fragmentada e Lenta",
        subtitle: "O desafio dos fundadores e incubadoras",
        body: "Documentos desconectados, preenchimentos soltos em ferramentas genéricas e falta de rigor analítico levam a erros conceituais graves no Canvas, metas e pitches de captação."
      },
      {
        tag: "ARQUITETURA",
        title: "O Harness de Agentes",
        subtitle: "Memória cumulativa e consistência cruzada",
        body: "Cada template possui um agente especialista. O harness injeta progressivamente o contexto validado (DNA, dores, personas) para que os próximos documentos nasçam perfeitamente alinhados."
      },
      {
        tag: "QUALIDADE",
        title: "Semáforo & Auto-Correção",
        subtitle: "Rigor crítico em tempo real",
        body: "🟢 Verde: Validado e robusto.<br>🟡 Amarela: Atenção, dados parciais.<br>🔴 Vermelha: Gargalo crítico.<br><br>O fundador insere justificativas reais e a IA reavalia e atualiza os arquivos instantaneamente."
      },
      {
        tag: "METODOLOGIA",
        title: "15 Modelos Canônicos",
        subtitle: "Da concepção ao pitch executivo",
        body: "Cobertura completa em 5 fases:<br>• <strong>Idea:</strong> 001 Registro, 002 Problema x Solução<br>• <strong>Validation:</strong> 003 Hipóteses, 004 Aprendizados, 005 Dores/Ganhos<br>• <strong>Strategy:</strong> 006 Personas, 007 Riscos, 008 MVP, 009 Canvas, 010 ESG<br>• <strong>Execution:</strong> 011 Metas, 012 Plano de Ação<br>• <strong>Pitch:</strong> 013 60s, 014 5m, 015 15m"
      },
      {
        tag: "ENTREGÁVEIS",
        title: "Exportação Multiformato",
        subtitle: "Padrão executivo para investidores",
        body: "• <strong>DOCX Individuais:</strong> 15 arquivos formatados.<br>• <strong>Dossiê Consolidado:</strong> Modelagem completa de 001 a 012 (SEM pitches).<br>• <strong>Pitches Isolados:</strong> Arquivos DOCX dedicados para 60s, 5m e 15m.<br>• <strong>Plano de Ação:</strong> Planilha XLSX com colunas de responsáveis, prazos e métricas."
      },
      {
        tag: "EXECUÇÃO",
        title: "Instalação Imediata via NPX",
        subtitle: "Pronto para rodar em segundos",
        body: "Comando único no terminal:<br><br><code style='background: rgba(0,0,0,0.5); padding: 0.8rem 1.2rem; border-radius: 8px; color: var(--accent-cyan); font-size: 1.1rem; display: inline-block;'>npx startcheck install</code><br><br>Selecione criar um por um, por grupo ou todos de uma vez!"
      }
    ];

    let currentSlide = 0;
    const wrapper = document.getElementById("slide-wrapper");
    const counter = document.getElementById("slide-counter");

    function renderSlide() {
      const s = slides[currentSlide];
      wrapper.innerHTML = `
        <span class="badge badge-cyan" style="width: fit-content; margin-bottom: 1rem;">${s.tag}</span>
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem; color: #fff;">${s.title}</h1>
        <h3 style="font-size: 1.2rem; color: var(--accent-cyan); margin-bottom: 1.5rem; font-weight: 400;">${s.subtitle}</h3>
        <div style="font-size: 1.1rem; color: var(--text-muted); line-height: 1.8;">${s.body}</div>
      `;
      counter.innerText = `Slide ${currentSlide + 1} de ${slides.length}`;
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--;
        renderSlide();
      }
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++;
        renderSlide();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") prevSlide();
      if (e.key === "ArrowRight") nextSlide();
    });

    renderSlide();
  </script>

  <footer class="footer">
    <p>StartCheck Docs — Documentação viva gerada pelo Reversa Docs</p>
  </footer>
</body>
</html>
